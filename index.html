<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<title>MOBIO • GUANTA OS Master</title>
<style>
:root{--panel:#071019;--line:#334955;--muted:#9cafbb;--cyan:#11dbe8;--danger:#ff5f68}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif;min-height:100%;overscroll-behavior:none}
body{display:flex;justify-content:center}
#device{position:relative;width:min(100vw,430px);height:100dvh;min-height:650px;overflow:hidden;background:radial-gradient(circle at 82% 10%,rgba(0,220,235,.18),transparent 28%),linear-gradient(180deg,#07131b 0%,#02070b 45%,#000 100%)}
#wallpaper{position:absolute;inset:0;background:radial-gradient(circle at 70% 12%,rgba(0,220,235,.12),transparent 25%),linear-gradient(180deg,#07131b,#02070b 55%,#000);z-index:0}
#wallpaper:after{content:"";position:absolute;left:0;right:0;bottom:0;height:34%;opacity:.42;background:linear-gradient(90deg,transparent 0 5%,#0c2632 5% 13%,transparent 13% 16%,#0a202a 16% 25%,transparent 25% 29%,#0d2a37 29% 40%,transparent 40% 44%,#0a202b 44% 56%,transparent 56% 60%,#0d2a37 60% 72%,transparent 72% 78%,#0a202a 78% 88%,transparent 88%)}
.status{position:absolute;z-index:20;top:0;left:0;right:0;height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:12px;font-weight:800;background:linear-gradient(180deg,rgba(3,9,13,.94),rgba(3,9,13,.48))}
.status-right{display:flex;align-items:center;gap:7px}.status-right img{display:block;object-fit:contain}.status-sat{width:27px;height:20px}.status-bat{width:72px;height:20px}.day-count{font-size:12px;font-weight:800;margin-left:-46px;margin-right:8px;min-width:44px;text-align:right}
.screen{position:absolute;z-index:5;top:48px;left:0;right:0;bottom:0;overflow:auto;padding:18px 18px 112px;scrollbar-width:none}.screen::-webkit-scrollbar{display:none}
h1{margin:8px 0 6px;font-size:28px;letter-spacing:.04em}h2,h3{margin-top:0}.muted,.sub{color:var(--muted);font-size:13px}
.home-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 10px;margin-top:28px}.app-btn{border:0;background:transparent;color:#fff;padding:0;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:10px;font-weight:800}
.icon{width:62px;height:62px;border-radius:15px;overflow:hidden;display:block;box-shadow:0 6px 16px rgba(0,0,0,.38)}.icon img{width:100%;height:100%;display:block;object-fit:cover}
.hero{margin-top:50px;border:1px solid var(--line);background:rgba(5,10,15,.84);border-radius:22px;padding:18px}
.dock{position:absolute;z-index:16;left:18px;right:18px;bottom:16px;height:78px;display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:7px 8px;border:1px solid var(--line);border-radius:24px;background:rgba(4,8,12,.93);backdrop-filter:blur(18px)}
.dock button{border:0;background:transparent;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:9px;font-weight:700}.dock .icon{width:47px;height:47px;border-radius:12px;box-shadow:none}
.apphead{display:flex;align-items:center;gap:14px;margin:2px 0 18px}.apphead .icon{width:68px;height:68px;border-radius:17px}
.panel,.listitem{border:1px solid var(--line);background:rgba(6,12,18,.88);border-radius:18px;padding:14px}.panel{margin-top:12px}.list{display:grid;gap:9px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btn{border:1px solid #405662;background:#101820;color:#fff;border-radius:14px;padding:12px;font-weight:800}.btn.cyan{border-color:#127783;background:#072a31}.btn.danger{border-color:#6a3439;background:#2b1115}
.input{width:100%;border:1px solid var(--line);background:#0a1218;color:#fff;border-radius:14px;padding:13px;font-size:15px}.tabs{display:flex;gap:8px;overflow:auto;margin:10px 0 12px}.tab{white-space:nowrap;border:1px solid var(--line);background:#0b141b;color:#fff;border-radius:999px;padding:9px 12px;font-size:12px}
.balance{font-size:34px;font-weight:900;margin:6px 0}.vsymbol{position:relative;display:inline-block;font-weight:900;padding:0 2px}.vsymbol:before,.vsymbol:after{content:"";position:absolute;left:0;right:0;height:2px;background:currentColor}.vsymbol:before{top:42%}.vsymbol:after{top:58%}
.map{height:260px;border:1px solid var(--line);border-radius:20px;position:relative;background:linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),radial-gradient(circle at 38% 57%,var(--cyan) 0 5px,transparent 6px),linear-gradient(135deg,#07131a,#0b2028);background-size:34px 34px,34px 34px,auto,auto}.map:after{content:"";position:absolute;left:18%;top:48%;width:62%;height:4px;border-radius:4px;background:var(--cyan);transform:rotate(-12deg);box-shadow:0 0 14px rgba(17,219,232,.75)}
.forecast{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.tile{border:1px solid var(--line);background:#081017;border-radius:14px;padding:10px;text-align:center}.weatherNow{font-size:58px;font-weight:900}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.photo{aspect-ratio:1;border:1px solid var(--line);border-radius:12px;background:linear-gradient(135deg,#1b3642,#47254e,#12354f)}.camera{height:390px;border:1px solid var(--line);border-radius:22px;background:radial-gradient(circle,#19242a 0 14%,#090e12 42%,#000 73%);display:flex;align-items:flex-end;justify-content:center;padding-bottom:24px}.shutter{width:72px;height:72px;border-radius:50%;border:7px solid #fff;background:#111}
.switch{width:46px;height:26px;border-radius:999px;border:1px solid var(--line);background:#1c2932;position:relative}.switch:after{content:"";position:absolute;top:2px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff}.switch.on{background:#0d5862}.switch.on:after{left:21px}
.result{border:1px solid var(--line);background:#081017;color:#fff;border-radius:14px;padding:10px;display:flex;align-items:center;gap:10px}.result .icon{width:38px;height:38px;border-radius:9px}.search-results{display:grid;gap:8px;margin-top:12px}
.sheet{position:absolute;z-index:45;left:16px;right:16px;bottom:104px;display:none;border:1px solid var(--line);border-radius:22px;background:#061018;padding:16px;box-shadow:0 20px 55px rgba(0,0,0,.55)}.sheet.show{display:block}
.overlay{position:absolute;z-index:70;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.76);backdrop-filter:blur(18px);padding:24px}.overlay.show{display:flex}.call-card{width:100%;border:1px solid var(--line);border-radius:26px;background:#071019;padding:24px;text-align:center}.call-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.lock{position:absolute;z-index:90;inset:0;background:radial-gradient(circle at 76% 18%,rgba(0,220,235,.18),transparent 28%),linear-gradient(180deg,#07131b,#02070b 52%,#000);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:86px 24px 34px;transition:transform .32s ease,opacity .32s ease}.lock.unlocking{transform:translateY(-100%);opacity:.12}.lock-top{text-align:center}.lock-time{font-size:68px;font-weight:300;letter-spacing:-3px;margin:18px 0 8px}.lock-date{color:var(--muted);font-size:15px}.lock-location{color:var(--muted);font-size:13px;margin-top:16px}.lock-notifs{width:100%;display:grid;gap:10px}.lock-hint{font-size:12px;color:var(--muted);margin-bottom:10px}.lock-bar{width:120px;height:5px;border-radius:10px;background:#fff;margin:auto}
.pull{position:absolute;z-index:65;left:0;right:0;top:0;transform:translateY(-105%);min-height:66%;background:rgba(3,8,12,.97);backdrop-filter:blur(20px);border-radius:0 0 26px 26px;border-bottom:1px solid var(--line);padding:62px 18px 22px;transition:transform .24s ease;overflow:auto}.pull.show{transform:translateY(0)}.ccgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.cctile{border:1px solid var(--line);background:#0a131a;border-radius:17px;padding:14px;min-height:78px;display:flex;flex-direction:column;justify-content:space-between}.wide{grid-column:1/-1}
.keyboard{display:grid;gap:8px}.keyrow{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}.key{border:0;background:#121a21;color:#fff;border-radius:8px;padding:10px 0;font-size:12px}
.app-library{display:grid;gap:18px}.lib-section{border:1px solid var(--line);border-radius:18px;padding:14px;background:#071018}.lib-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.miniapp{border:0;background:transparent;color:#fff;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10px}.miniapp .icon{width:48px;height:48px;border-radius:11px}.about-img{width:100%;border-radius:18px;border:1px solid var(--line);margin-top:10px}
</style></head>

const APPS=['CONTACTS','MAGELLAN','SENDIE','ALBUM','WEATHER','CAMERA','SETTINGS'], DOCK=['CALLS','MESSAGES','BATTUTA','MOONDO'], ALL=[...APPS,...DOCK];
const state={quiet:false,flash:false,lang:'EN',sendieBalance:12840,locked:true,current:'HOME',photos:12,alarm:'06:30',brightness:72,volume:58};
const screen=document.getElementById('screen'),dock=document.getElementById('dock'),sheet=document.getElementById('sheet'),pull=document.getElementById('pull'),overlay=document.getElementById('overlay'),lock=document.getElementById('lock'),device=document.getElementById('device');
function batteryDays(){let first=localStorage.getItem('mobio-first-day');if(!first){first=Date.now();localStorage.setItem('mobio-first-day',first)}return Math.max(0,2000-Math.floor((Date.now()-Number(first))/86400000))}
function tick(){const d=new Date(),t=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});statusTime.textContent=t;lockTime.textContent=t;lockDate.textContent=d.toLocaleDateString([],{weekday:'long',day:'numeric',month:'long'});dayCount.textContent=batteryDays()+' D'}
function icon(n){return `<span class="icon"><img src="${ICONS[n]}" alt="${n}"></span>`}
function renderDock(){dock.style.display=state.locked?'none':'grid';dock.innerHTML=DOCK.map(n=>`<button data-d="${n}">${icon(n)}<span>${n}</span></button>`).join('');dock.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>openApp(b.dataset.d))}
function appHead(n,sub='GUANTA OS'){return `<div class="apphead">${icon(n)}<div><h1 style="margin:0">${n}</h1><div class="sub">${sub}</div></div></div>`}
function home(){state.current='HOME';screen.innerHTML=`<h1>GUANTA OS</h1><div class="sub">VYRSIA • Satellite link active</div><div class="home-grid">${APPS.map(n=>`<button class="app-btn" data-a="${n}">${icon(n)}<span>${n}</span></button>`).join('')}</div><div class="hero"><h2>VYRSIA</h2><p class="muted">Connected world</p><p class="muted">Avatar Location • Central</p><strong>Satellite link active</strong></div>`;screen.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>openApp(b.dataset.a));renderDock();closePull();closeSheet()}
function search(){state.current='SEARCH';screen.innerHTML=`<h1>Search</h1><div class="sub">GUANTA OS</div><input class="input" id="q" placeholder="Search apps, files, contacts, settings, BATTUTA, web"><div class="search-results" id="results"></div><div class="panel"><b>Quick Search</b><p class="muted">Web search opens in MOONDO</p><button class="btn" id="kbd">Open GUANTA keyboard</button></div>`;renderDock();const q=document.getElementById('q'),r=document.getElementById('results');const draw=()=>{let s=q.value.toLowerCase();r.innerHTML=ALL.filter(a=>a.toLowerCase().includes(s)).map(a=>`<button class="result" data-r="${a}">${icon(a)}<span>${a}</span></button>`).join('');r.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>openApp(b.dataset.r))};q.oninput=draw;draw();kbd.onclick=showKeyboard}
function library(){state.current='LIBRARY';screen.innerHTML=`<h1>APP LIBRARY</h1><input class="input" placeholder="Search apps"><div class="app-library"><div><div class="sub">COMMUNICATION</div><div class="lib-section lib-row">${['CALLS','MESSAGES','CONTACTS'].map(n=>`<button class="miniapp" data-l="${n}">${icon(n)}<span>${n}</span></button>`).join('')}</div></div><div><div class="sub">TRAVEL</div><div class="lib-section lib-row">${['BATTUTA','MAGELLAN','WEATHER'].map(n=>`<button class="miniapp" data-l="${n}">${icon(n)}<span>${n}</span></button>`).join('')}</div></div><div><div class="sub">MEDIA</div><div class="lib-section lib-row">${['ALBUM','CAMERA','MOONDO'].map(n=>`<button class="miniapp" data-l="${n}">${icon(n)}<span>${n}</span></button>`).join('')}</div></div><div><div class="sub">SYSTEM</div><div class="lib-section lib-row">${['SETTINGS','SENDIE'].map(n=>`<button class="miniapp" data-l="${n}">${icon(n)}<span>${n}</span></button>`).join('')}</div></div></div>`;renderDock();screen.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>openApp(b.dataset.l))}
function openApp(n){({CALLS:calls,MESSAGES:messages,CONTACTS:contacts,BATTUTA:battuta,MAGELLAN:magellan,SENDIE:sendie,ALBUM:album,WEATHER:weather,CAMERA:camera,SETTINGS:settings,MOONDO:moondo}[n]||home)()}
function calls(){state.current='CALLS';screen.innerHTML=appHead('CALLS','Satellite voice')+`<div class="list"><div class="listitem row"><span>Ali Riyadh</span><span class="muted">Today</span></div><div class="listitem row"><span>Tayba</span><span class="muted">Yesterday</span></div></div><div class="two" style="margin-top:12px"><button class="btn" onclick="showKeypad()">Keypad</button><button class="btn cyan" onclick="incomingCall()">Demo incoming call</button></div>`;renderDock()}
function messages(){state.current='MESSAGES';screen.innerHTML=appHead('MESSAGES','Satellite messaging')+`<div class="list"><div class="listitem"><b>Mira</b><div class="muted">See you soon</div></div><div class="listitem"><b>Eimar</b><div class="muted">Sent from GUANTA OS</div></div></div><div class="row" style="margin-top:12px"><input class="input" id="msg" placeholder="Message" readonly><button class="btn" id="msgkbd">⌨</button></div>`;renderDock();msgkbd.onclick=showKeyboard}
function contacts(){state.current='CONTACTS';screen.innerHTML=appHead('CONTACTS','People')+`<input class="input" placeholder="Search contacts"><div class="list" style="margin-top:12px"><div class="listitem">Ali Riyadh</div><div class="listitem">Mira</div><div class="listitem">Eimar</div><div class="listitem">Tayba</div></div>`;renderDock()}
function battuta(){state.current='BATTUTA';screen.innerHTML=appHead('BATTUTA','Maps & Navigation')+`<input class="input" placeholder="Where to?"><div class="map" style="margin-top:12px"></div><div class="panel row"><div><b>Destination</b><div class="muted">12 min • 4.8 km</div></div><button class="btn cyan">START</button></div>`;renderDock()}
function magellan(){state.current='MAGELLAN';screen.innerHTML=appHead('MAGELLAN','Flights • Hotels • Discovery')+`<div class="tabs"><button class="tab">✈ Flights</button><button class="tab">Hotels</button><button class="tab">Discover</button></div><div class="panel"><input class="input" value="Baghdad (BGW)"><input class="input" style="margin-top:8px" value="Dubai (DXB)"><div class="two" style="margin-top:8px"><input class="input" value="10 Oct"><input class="input" value="1 Traveler"></div><button class="btn cyan" style="margin-top:10px;width:100%">Search flights</button></div>`;renderDock()}
function sendie(){state.current='SENDIE';screen.innerHTML=appHead('SENDIE','VYRSYON wallet')+`<div class="panel"><div class="muted">Available balance</div><div class="balance"><span class="vsymbol">V</span> ${state.sendieBalance.toLocaleString()}</div><div class="two"><button class="btn cyan" id="transfer">TRANSFER</button><button class="btn" id="topup">TOP UP</button></div></div><div class="panel"><b>Recent</b><div class="list" style="margin-top:10px"><div class="listitem row"><span>Transfer to Mira</span><b>-250 VSN</b></div><div class="listitem row"><span>Top Up</span><b>+1,000 VSN</b></div></div></div>`;renderDock();transfer.onclick=transferMoney;topup.onclick=()=>{state.sendieBalance+=500;sendie()}}
function transferMoney(){sheet.innerHTML=`<h3>Transfer VYRSYON</h3><input class="input" id="to" placeholder="Recipient"><input class="input" id="amt" style="margin-top:8px" placeholder="Amount"><button class="btn cyan" style="margin-top:10px;width:100%" id="sendNow">Send</button>`;sheet.classList.add('show');sendNow.onclick=()=>{let a=Number(amt.value||0);if(a>0&&a<=state.sendieBalance)state.sendieBalance-=a;closeSheet();sendie()}}
function album(){state.current='ALBUM';screen.innerHTML=appHead('ALBUM','Photos & Media')+`<div class="photos">${Array.from({length:state.photos},(_,i)=>`<div class="photo" style="filter:hue-rotate(${i*21}deg)"></div>`).join('')}</div><button class="btn" style="width:100%;margin-top:12px" onclick="shareSheet()">Share</button>`;renderDock()}
function weather(){state.current='WEATHER';screen.innerHTML=appHead('WEATHER','Avatar location forecast')+`<div class="panel"><div class="muted">VYRSIA • Central</div><div class="weatherNow">31°</div><b>Partly Cloudy</b><div class="muted">Feels like 33°</div></div><div class="forecast" style="margin-top:10px">${['Now','+1h','+2h','+3h'].map((x,i)=>`<div class="tile"><b>${x}</b><div style="font-size:22px;margin:7px 0">${31-i}°</div><span class="muted">Cloudy</span></div>`).join('')}</div>`;renderDock()}
function camera(){state.current='CAMERA';screen.innerHTML=appHead('CAMERA','Capture')+`<div class="camera"><button class="shutter" id="shot"></button></div><div class="two" style="margin-top:10px"><button class="btn">PHOTO</button><button class="btn">VIDEO</button></div>`;renderDock();shot.onclick=()=>{state.photos++;toast('Captured • Saved to ALBUM')}}
function settings(){state.current='SETTINGS';screen.innerHTML=appHead('SETTINGS','System Settings')+`<div class="list"><div class="listitem row"><span>Satellite</span><b>Connected</b></div><div class="listitem row"><span>Quite Mode</span><button class="switch ${state.quiet?'on':''}" id="quiet"></button></div><div class="listitem row"><span>Battery</span><b>${batteryDays()} D</b></div><div class="listitem" data-set="privacy">Privacy</div><div class="listitem" data-set="access">Accessibility</div><div class="listitem" data-set="sound">Sound & Haptics</div><div class="listitem" data-set="power">Power</div><div class="listitem" data-set="files">Files</div><div class="listitem" data-set="gestures">Gestures</div><div class="listitem" data-set="system">System Info</div><div class="listitem" data-set="about">About MOBIO</div></div>`;renderDock();quiet.onclick=()=>{state.quiet=!state.quiet;settings()};screen.querySelectorAll('[data-set]').forEach(x=>x.onclick=()=>settingDetail(x.dataset.set))}
function settingDetail(k){const map={privacy:'Permissions • Location • Microphone • Camera',access:'Text Size • Motion • Haptics • Voice',sound:'Ringtone • Haptics • Volume',power:'5-year battery architecture • symbolic remaining-day counter',files:'Local Files • Downloads • Shared',gestures:'Swipe up: Home • Swipe down right: Control Center • Swipe down left: Notifications • Swipe right: Search • Swipe left: App Library',system:'MOBIO • GUANTA OS • Direct satellite connectivity only',about:'All-glass MOBIO body • wraparound display • four-lens 2×2 rear camera • BLACK / WHITE / RED'};let extra=k==='about'?`<img class="about-img" src="${EXT}" alt="MOBIO exterior">`:'';screen.innerHTML=`<h1>${k.toUpperCase()}</h1><div class="panel"><p>${map[k]}</p>${extra}<button class="btn" style="width:100%" onclick="settings()">Back</button></div>`;renderDock()}
function moondo(){state.current='MOONDO';screen.innerHTML=appHead('MOONDO','Private browser')+`<div class="row"><input class="input" id="url" value="https://"><button class="btn" id="go">GO</button></div><div class="panel" id="web"><h3>MOONDO</h3><div class="list"><div class="listitem">Bookmarks</div><div class="listitem">History</div><div class="listitem">Private Mode</div></div></div>`;renderDock();go.onclick=()=>web.innerHTML=`<h3>Page loaded</h3><p class="muted">${url.value}</p>`}
function showControl(){pull.innerHTML=`<h2>Control Center</h2><div class="sub">Direct Satellite • ${batteryDays()} D</div><div class="ccgrid" style="margin-top:14px"><div class="cctile"><b>Satellite</b><span class="muted">Connected</span></div><div class="cctile"><b>Battery</b><span>${batteryDays()} D</span></div><div class="cctile" onclick="qr()">QR Code Reader</div><div class="cctile" onclick="calculator()">Calculator</div><div class="cctile" onclick="toggleFlash()">Flashlight <span>${state.flash?'On':'Off'}</span></div><div class="cctile" onclick="alarm()">Alarm <span>${state.alarm}</span></div><div class="cctile wide" onclick="toggleQuiet()"><b>Quite Mode</b><span>${state.quiet?'On':'Off'}</span></div><div class="cctile wide"><b>Brightness</b><input type="range" min="0" max="100" value="${state.brightness}" oninput="state.brightness=this.value"></div><div class="cctile wide"><b>Volume</b><input type="range" min="0" max="100" value="${state.volume}" oninput="state.volume=this.value"></div></div>`;pull.classList.add('show')}
function showNotifications(){pull.innerHTML=`<h2>NOTIFICATIONS</h2>${[['CALLS','Missed call from Ameer'],['MESSAGES','Tayba Qais: Presentation is ready'],['ALBUM','3 new memories available'],['MOONDO','Download completed'],['WEATHER','Temperature reaches 34° today'],['ALARM','Next alarm at '+state.alarm]].map(x=>`<div class="listitem" style="margin-top:8px"><b>${x[0]}</b><div>${x[1]}</div></div>`).join('')}`;pull.classList.add('show')}
function closePull(){pull.classList.remove('show')}function closeSheet(){sheet.classList.remove('show')}function toggleFlash(){state.flash=!state.flash;showControl()}function toggleQuiet(){state.quiet=!state.quiet;showControl()}
function qr(){sheet.innerHTML='<h3>QR Code Reader</h3><div class="panel" style="height:210px;display:flex;align-items:center;justify-content:center;font-size:68px">▦</div><button class="btn" style="width:100%" onclick="closeSheet()">Close</button>';sheet.classList.add('show')}
function calculator(){sheet.innerHTML='<h3>Calculator</h3><input class="input" id="calc" placeholder="2+2"><button class="btn" style="margin-top:8px;width:100%" onclick="calcResult()">=</button><div id="cres" class="balance"></div>';sheet.classList.add('show')}function calcResult(){try{let v=calc.value;if(!/^[0-9+\-*/(). ]+$/.test(v))throw 0;cres.textContent=Function('return '+v)()}catch(e){cres.textContent='Error'}}
function alarm(){sheet.innerHTML=`<h3>Alarm</h3><input class="input" type="time" id="alarmTime" value="${state.alarm}"><button class="btn" style="margin-top:8px;width:100%" id="saveAlarm">Save</button>`;sheet.classList.add('show');saveAlarm.onclick=()=>{state.alarm=alarmTime.value;closeSheet();showControl()}}
function showKeyboard(){let keys=['Q','W','E','R','T','Y','U','I','O','P'];sheet.innerHTML=`<div class="keyboard"><div class="row"><b>EN | عربي</b><span class="vsymbol">V</span></div><div class="keyrow">${keys.map(k=>`<button class="key">${k}</button>`).join('')}</div><div class="keyrow">${['A','S','D','F','G','H','J','K','L','⌫'].map(k=>`<button class="key">${k}</button>`).join('')}</div><div class="keyrow">${['⇧','Z','X','C','V','B','N','M','.','⏎'].map(k=>`<button class="key">${k}</button>`).join('')}</div></div>`;sheet.classList.add('show')}
function showKeypad(){sheet.innerHTML=`<h3>Keypad</h3><div class="three">${[1,2,3,4,5,6,7,8,9,'*',0,'#'].map(k=>`<button class="btn">${k}</button>`).join('')}</div><button class="btn" style="width:100%;margin-top:10px" onclick="closeSheet()">Done</button>`;sheet.classList.add('show')}
function incomingCall(){overlay.innerHTML=`<div class="call-card"><div class="muted">INCOMING CALL</div><h2>Ali Riyadh</h2><div class="muted">Incoming via satellite</div><div class="call-actions"><button class="btn danger" id="decline">Decline</button><button class="btn cyan" id="accept">Accept</button></div><p class="muted" style="margin-top:18px">VYRSIA remains active</p></div>`;overlay.classList.add('show');decline.onclick=()=>overlay.classList.remove('show');accept.onclick=activeCall}
function activeCall(){overlay.innerHTML=`<div class="call-card"><h2>Ali Riyadh</h2><div class="muted">Call Active</div><div class="three" style="margin-top:18px"><button class="btn">Mute</button><button class="btn">Keypad</button><button class="btn">Speaker</button><button class="btn">Add Call</button><button class="btn">Video</button><button class="btn">More</button></div><button class="btn danger" style="width:100%;margin-top:12px" onclick="overlay.classList.remove('show')">End Call</button></div>`}
function shareSheet(){sheet.innerHTML='<h3>Share</h3><div class="list"><div class="listitem">Messages</div><div class="listitem">SENDIE</div><div class="listitem">Copy Link</div></div><button class="btn" style="width:100%;margin-top:10px" onclick="closeSheet()">Close</button>';sheet.classList.add('show')}
function multitask(){state.current='MULTITASK';screen.innerHTML=`<h1>Multitasking</h1><div class="list">${['MESSAGES','BATTUTA','MOONDO'].map(n=>`<button class="listitem row" style="color:#fff" onclick="openApp('${n}')">${icon(n)}<b>${n}</b></button>`).join('')}</div>`;renderDock()}
function toast(t){sheet.innerHTML=`<b>${t}</b>`;sheet.classList.add('show');setTimeout(closeSheet,1200)}
function unlock(){state.locked=false;lock.classList.add('unlocking');setTimeout(()=>{lock.style.display='none';lock.classList.remove('unlocking')},320);home()}
function relock(){state.locked=true;lock.style.display='flex';lock.classList.remove('unlocking');renderDock()}
let sx=0,sy=0,st=0;device.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;st=Date.now()});device.addEventListener('pointerup',e=>{let dx=e.clientX-sx,dy=e.clientY-sy,dur=Date.now()-st;if(state.locked){if(dy<-65)unlock();return}if(pull.classList.contains('show')){if(dy<-70)closePull();return}if(sy<72&&dy>70){sx>device.clientWidth/2?showControl():showNotifications();return}if(Math.abs(dx)>90&&Math.abs(dx)>Math.abs(dy)){dx>0?search():library();return}if(sy>device.clientHeight-130&&dy<-90){dur>420?multitask():home();return}})
tick();setInterval(tick,30000);home();relock();
</script></body></html>
