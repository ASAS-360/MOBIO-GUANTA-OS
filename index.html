<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GUANTA OS v0.3</title>
<link rel="stylesheet" href="src/style.css">
</head>
<body>
<div class="app-shell">
  <div>
    <div class="phone" id="phone">
      <div class="wallpaper"></div>
      <div class="status"><span id="statusLeft"></span><span id="statusRight"></span></div>
      <main id="content" class="content"></main>
      <div id="dock" class="dock"></div>
      <div id="overlay" class="overlay"></div>
      <div id="toast" class="toast"></div>
    </div>
  </div>

  <aside class="side">
    <h1>MOBIO • GUANTA OS</h1>
    <p>v0.3 — functional core apps build.</p>

    <div class="controls">
      <button class="btn" data-nav="lock">Lock</button>
      <button class="btn" data-nav="home">Home</button>
      <button class="btn" data-nav="search">Search</button>
      <button class="btn" data-nav="control">Control Center</button>
      <button class="btn" data-nav="notifications">Notifications</button>
      <button class="btn" data-nav="switcher">Multitasking</button>
      <button class="btn" data-nav="settings">Settings</button>
      <button class="btn" id="demoCall">Incoming Call</button>
      <button class="btn" id="batteryTick">-1 Battery Day</button>
    </div>

    <p>Gestures: top-right pull = Control Center, top-left pull = Notifications, swipe up = Home, hold + swipe up = Multitasking, left-edge swipe = Home.</p>
    <div>
      <span class="badge">Satellite only</span>
      <span class="badge">2000 D</span>
      <span class="badge">No Wi‑Fi</span>
      <span class="badge">No Cellular</span>
      <span class="badge">Arabic / English</span>
      <span class="badge">Call Overlay</span>
    </div>
  </aside>
</div>
<script src="src/app.js"></script>
</body>
</html>
