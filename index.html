<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MOBIO • GUANTA OS v0.4</title>
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--line:#394955;--panel:#0b1016;--text:#fff}
body{margin:0;background:#020406;color:var(--text);font-family:Arial,Helvetica,sans-serif;min-height:100vh}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;gap:24px;padding:18px;flex-wrap:wrap}
.phone{width:390px;height:844px;position:relative;overflow:hidden;border-radius:48px;background:#000;border:2px solid #cad2d8;box-shadow:0 30px 80px #000}
.screen{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.hit{position:absolute;border:0;background:transparent;z-index:4;cursor:pointer}
.call-overlay{display:none;position:absolute;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(14px);z-index:20;align-items:center;justify-content:center;padding:24px}
.call-overlay.show{display:flex}
.call-card{width:100%;border:1px solid var(--line);border-radius:26px;background:#0b1016;padding:24px;text-align:center}
.small{font-size:13px;color:#9faebb}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.actions button,.toolbar button{background:#121a22;color:white;border:1px solid #425461;border-radius:12px;padding:11px;font-weight:700}
.toolbar{width:300px;display:grid;gap:8px;background:#0a0f14;border:1px solid var(--line);padding:16px;border-radius:20px}
@media(max-width:760px){.stage{padding:0;background:#000}.phone{width:min(100vw,390px);height:min(216.41vw,844px);border:0;border-radius:0}.toolbar{width:min(100vw,390px);border-radius:0;border-left:0;border-right:0}.screen{object-fit:fill}}

.icon-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 10px;margin-top:18px}
.icon-app{border:0;background:transparent;color:#fff;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:10px;font-weight:800;cursor:pointer}
.app-icon{width:52px;height:52px;object-fit:cover;border-radius:9px;display:block}
.dock button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:3px;font-size:9px}
.dock .app-icon{width:44px;height:44px}
.vyrsia-card{margin-top:50px;padding:18px;border:1px solid var(--line);border-radius:20px;background:rgba(9,14,20,.94)}
.vyrsia-card p{color:var(--muted);font-size:13px}.vyrsia-card strong{font-size:13px}
.lockbox{text-align:center;padding-top:190px}.brand{font-size:52px;font-weight:900}.time{font-size:40px;font-weight:900;margin:25px 0}
.app-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}.app-head .app-icon{width:64px;height:64px}
.result{display:flex;align-items:center;gap:12px;width:100%;color:#fff;text-align:left}
.result .app-icon{width:38px;height:38px}
</style>
</head>
<body>
<div class="app-shell">
  <div>
    <div class="phone" id="phone">
      <div class="wallpaper"></div>
      <div class="status"><span id="statusLeft"></span><span id="statusRight"></span></div>
      <main id="content" class="content"></main>
      <div id="dock" class="dock"></div>
      <div id="overlay" class="overlay"></div>
      <div id="toast" class="toast"></div>
    </div>
  </div>
  <aside class="side">
    <h1>MOBIO • GUANTA OS</h1>
    <p>v0.4 — visual build with approved fixed icons.</p>
    <div class="controls">
      <button class="btn" data-nav="lock">Lock</button>
      <button class="btn" data-nav="home">Home</button>
      <button class="btn" data-nav="search">Search</button>
      <button class="btn" data-nav="control">Control Center</button>
      <button class="btn" data-nav="notifications">Notifications</button>
      <button class="btn" id="demoCall">Incoming Call</button>
      <button class="btn" id="batteryTick">-1 Battery Day</button>
    </div>
    <p>Satellite only • 2000 D • fixed dock: Calls / Messages / BATTUTA / MOONDO</p>
  </aside>
</div>

let current="lock";
const screen=document.getElementById("screen");
const hs=document.getElementById("hotspots");
const overlay=document.getElementById("callOverlay");

function addHit(x,y,w,h,fn,label){
 const b=document.createElement("button");b.className="hit";b.style.left=x+"px";b.style.top=y+"px";
 b.style.width=w+"px";b.style.height=h+"px";b.setAttribute("aria-label",label||"");b.onclick=fn;hs.appendChild(b);
}
function show(name){
 current=name;screen.src=A[name];hs.innerHTML="";
 if(name==="lock"){
   addHit(35,650,320,160,()=>show("home"),"Unlock");
   addHit(285,0,105,85,()=>show("control"),"Control Center");
   addHit(0,0,105,85,()=>show("notifications"),"Notifications");
 }
 if(name==="home"){
   addHit(35,115,85,105,()=>show("settings"),"Contacts");
   addHit(125,115,85,105,()=>show("magellan"),"MAGELLAN");
   addHit(215,115,85,105,()=>show("sendie"),"SENDIE");
   addHit(300,115,80,105,()=>show("album"),"ALBUM");
   addHit(35,225,85,105,()=>show("weather"),"WEATHER");
   addHit(125,225,85,105,()=>show("camera"),"CAMERA");
   addHit(215,225,85,105,()=>show("settings"),"SETTINGS");
   addHit(35,720,75,95,()=>show("calls"),"Calls");
   addHit(115,720,75,95,()=>show("messages"),"Messages");
   addHit(195,720,75,95,()=>show("battuta"),"BATTUTA");
   addHit(275,720,80,95,()=>show("moondo"),"MOONDO");
   addHit(285,0,105,85,()=>show("control"),"Control Center");
   addHit(0,0,105,85,()=>show("notifications"),"Notifications");
 }
 if(["search","control","notifications","switcher","calls","messages","battuta","moondo","sendie","magellan","weather","album","camera","settings"].includes(name)){
   addHit(0,790,390,54,()=>show("home"),"Home");
 }
}
document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>show(b.dataset.go));
document.getElementById("demoCall").onclick=()=>overlay.classList.add("show");
document.getElementById("decline").onclick=()=>overlay.classList.remove("show");
document.getElementById("accept").onclick=()=>overlay.classList.remove("show");

let sx=0,sy=0;
document.getElementById("phone").addEventListener("pointerdown",e=>{sx=e.clientX;sy=e.clientY});
document.getElementById("phone").addEventListener("pointerup",e=>{
 const dx=e.clientX-sx,dy=e.clientY-sy;
 if(sy<80&&dy>70){show(sx>195?"control":"notifications");return}
 if(dy<-90){show("home");return}
 if(sx<35&&dx>90){show("home");return}
});
show("lock");
</script>
