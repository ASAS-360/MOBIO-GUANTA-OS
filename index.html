<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MOBIO • GUANTA OS v0.4.1</title>
<style>
:root {
  --bg:#03070b;
  --panel:rgba(10,15,21,.90);
  --line:#334652;
  --text:#fff;
  --muted:#9fb1bd;
  --accent:#00dceb;
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; min-height:100%; background:#000; color:var(--text); font-family:Arial,Helvetica,sans-serif; }
body { display:flex; justify-content:center; align-items:flex-start; padding:18px; }

.phone {
  width:390px;
  height:844px;
  max-width:100vw;
  position:relative;
  overflow:hidden;
  border-radius:46px;
  border:1px solid #657581;
  background:
    radial-gradient(circle at 78% 18%, rgba(0,220,235,.18), transparent 30%),
    linear-gradient(180deg,#08121a 0%,#03070b 62%,#010203 100%);
  box-shadow:0 26px 70px rgba(0,0,0,.68);
}
.status {
  position:absolute; z-index:10; top:0; left:0; right:0; height:46px;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 16px; font-size:12px; font-weight:800;
}
.content {
  position:absolute; z-index:2; top:46px; left:0; right:0; bottom:92px;
  overflow:auto; padding:18px 18px 26px;
}
.header h1 { margin:0; font-size:26px; }
.header p { margin:6px 0 18px; color:var(--muted); font-size:13px; }
.grid {
  display:grid; grid-template-columns:repeat(4,1fr); gap:20px 10px; align-items:start;
}
.app {
  border:0; background:transparent; color:white; padding:0; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:7px;
  font-size:10px; font-weight:700;
}
.app img, .appicon {
  width:56px; height:56px; border-radius:12px; display:block; object-fit:cover;
  box-shadow:0 5px 16px rgba(0,0,0,.35);
}
.vyrsia {
  margin-top:54px; background:var(--panel); border:1px solid var(--line);
  border-radius:22px; padding:18px;
}
.vyrsia .title { font-size:22px; font-weight:900; }
.vyrsia p { margin:7px 0; color:var(--muted); font-size:13px; }
.vyrsia strong { font-size:13px; }

.dock {
  position:absolute; z-index:9; left:18px; right:18px; bottom:18px; height:70px;
  display:grid; grid-template-columns:repeat(4,1fr); gap:8px; padding:8px;
  background:rgba(7,11,15,.92); border:1px solid var(--line); border-radius:22px;
  backdrop-filter:blur(16px);
}
.dock button {
  border:0; background:transparent; color:white; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:2px; font-size:9px; font-weight:700;
}
.dock img { width:44px; height:44px; border-radius:10px; object-fit:cover; }

.card {
  background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:18px; margin-bottom:14px;
}
.titlebar {
  display:flex; align-items:center; gap:14px; margin-bottom:18px;
}
.titlebar img { width:64px; height:64px; border-radius:14px; }
.titlebar h2 { margin:0; font-size:28px; }
.note { color:var(--muted); font-size:13px; line-height:1.45; }
.btn {
  border:1px solid #40525f; background:#111922; color:white; border-radius:14px;
  padding:12px 14px; font-weight:800; cursor:pointer;
}
.full { width:100%; }

.search {
  width:100%; border:1px solid var(--line); background:#0b1219; color:white;
  border-radius:14px; padding:13px 14px; font-size:15px; outline:none;
}
.results { margin-top:12px; }
.result {
  width:100%; display:flex; align-items:center; gap:12px; padding:10px 12px;
  border:1px solid var(--line); background:var(--panel); color:white; border-radius:14px; margin-bottom:8px;
}
.result img { width:38px; height:38px; border-radius:9px; }

.overlay {
  display:none; position:absolute; z-index:30; inset:0; background:rgba(0,0,0,.72);
  backdrop-filter:blur(16px); align-items:center; justify-content:center; padding:24px;
}
.overlay.show { display:flex; }
.callbox {
  width:100%; background:#0a1016; border:1px solid var(--line); border-radius:26px; padding:24px; text-align:center;
}
.callbox h3 { font-size:28px; margin:10px 0 6px; }
.actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:20px; }

.lock {
  height:100%; display:flex; align-items:center; justify-content:center; text-align:center;
}
.lock .brand { font-size:52px; font-weight:900; letter-spacing:2px; }
.lock .clock { font-size:42px; font-weight:900; margin:26px 0 10px; }
.lock .sub { color:var(--muted); font-size:13px; margin-bottom:20px; }

@media (max-width:430px) {
  body { padding:0; }
  .phone { width:100vw; height:100vh; border-radius:0; border:0; }
}
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="status"><span id="time"></span><span id="sys">SAT • 2000 D</span></div>
  <main class="content" id="content"></main>
  <div class="dock" id="dock"></div>
  <div class="overlay" id="overlay"></div>
</div>

const state={
  screen:'lock',
  batteryDays:2000,
  quiet:false,
  flashlight:false,
  notifications:[
    {app:'Messages',title:'New message',body:'GUANTA OS test notification'},
    {app:'MOONDO',title:'Page ready',body:'MOONDO finished loading a page'},
    {app:'WEATHER',title:'Forecast updated',body:'Weather data refreshed'}
  ]
};

const topApps=['Contacts','MAGELLAN','SENDIE','ALBUM','WEATHER','CAMERA','Settings'];
const dockApps=['Calls','Messages','BATTUTA','MOONDO'];

const content=document.getElementById('content');
const dock=document.getElementById('dock');
const overlay=document.getElementById('overlay');
const timeEl=document.getElementById('time');
const sysEl=document.getElementById('sys');
const phone=document.getElementById('phone');

function tickStatus(){
  const d=new Date();
  timeEl.textContent=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  sysEl.textContent=`SAT • ${state.batteryDays} D`;
}
function icon(name,cls='appicon') {
  return ICONS[name] ? `<img class="${cls}" src="${ICONS[name]}" alt="${name}">` : '';
}
function renderDock() {
  dock.style.display='grid';
  dock.innerHTML=dockApps.map(a=>`<button data-dock="${a}">${icon(a)}<span>${a}</span></button>`).join('');
  dock.querySelectorAll('[data-dock]').forEach(b=>b.onclick=()=>openApp(b.dataset.dock));
}
function renderLock() {
  state.screen='lock';
  dock.style.display='none';
  content.innerHTML=`<div class="lock">
    <div>
      <div class="brand">MOBIO</div>
      <div class="sub">VYRSIA ACTIVE</div>
      <div class="clock">${new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div>
      <button class="btn" id="unlock">Unlock</button>
    </div>
  </div>`;
  document.getElementById('unlock').onclick=renderHome;
}
function renderHome() {
  state.screen='home';
  content.innerHTML=`<div class="header">
    <h1>GUANTA OS</h1>
    <p>VYRSIA • Satellite link active</p>
  </div>
  <div class="grid">
    ${topApps.map(a=>`<button class="app" data-app="${a}">${icon(a)}<span>${a.toUpperCase()}</span></button>`).join('')}
  </div>
  <div class="vyrsia">
    <div class="title">VYRSIA</div>
    <p>Connected World</p>
    <p>Avatar Location • Central</p>
    <strong>Satellite link active</strong>
  </div>`;
  renderDock();
  content.querySelectorAll('[data-app]').forEach(b=>b.onclick=()=>openApp(b.dataset.app));
}
function openApp(name) {
  state.screen='app:'+name;
  content.innerHTML=`<div class="titlebar">${icon(name)}<div><h2>${name}</h2><div class="note">GUANTA OS</div></div></div>
  <div class="card">
    <b>${name}</b>
    <p class="note">Visual module using the approved GUANTA OS icon identity.</p>
    <button class="btn full" id="homeBtn">Home</button>
  </div>`;
  renderDock();
  document.getElementById('homeBtn').onclick=renderHome;
}
function renderControl() {
  state.screen='control';
  content.innerHTML=`<div class="header"><h1>Control Center</h1><p>Satellite only • ${state.batteryDays} D</p></div>
  <div class="card"><b>Satellite Connected</b><p class="note">Direct Satellite</p></div>
  <div class="card"><b>Quite Mode</b><p class="note">${state.quiet?'On':'Off'}</p><button class="btn" id="quiet">Toggle</button></div>
  <div class="card"><b>Flashlight</b><p class="note">${state.flashlight?'On':'Off'}</p><button class="btn" id="flash">Toggle</button></div>`;
  renderDock();
  document.getElementById('quiet').onclick=()=>{state.quiet=!state.quiet;renderControl();};
  document.getElementById('flash').onclick=()=>{state.flashlight=!state.flashlight;renderControl();};
}
function renderNotifications() {
  state.screen='notifications';
  content.innerHTML=`<div class="header"><h1>Notifications</h1><p>GUANTA OS</p></div>`+
  state.notifications.map(n=>`<div class="card"><b>${n.app}</b><p>${n.title}</p><p class="note">${n.body}</p></div>`).join('');
  renderDock();
}
function renderSearch() {
  state.screen='search';
  content.innerHTML=`<div class="header"><h1>Search</h1><p>GUANTA OS</p></div>
  <input id="q" class="search" placeholder="Search apps">
  <div class="results" id="results"></div>`;
  renderDock();
  const q=document.getElementById('q'), r=document.getElementById('results');
  const all=[...topApps,...dockApps];
  const draw=()=>{
    const s=q.value.toLowerCase();
    r.innerHTML=all.filter(a=>a.toLowerCase().includes(s)).map(a=>`<button class="result" data-r="${a}">${icon(a)}<span>${a}</span></button>`).join('');
    r.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>openApp(b.dataset.r));
  };
  q.oninput=draw; draw();
}

function incomingCall() {
  overlay.innerHTML=`<div class="callbox"><div class="note">Incoming physical-phone call</div><h3>Incoming Call</h3><div class="note">VYRSIA remains active</div>
  <div class="actions"><button class="btn" id="decline">Decline</button><button class="btn" id="accept">Accept</button></div></div>`;
  overlay.classList.add('show');
  document.getElementById('decline').onclick=()=>overlay.classList.remove('show');
  document.getElementById('accept').onclick=()=>overlay.classList.remove('show');
}

let sx=0, sy=0;
phone.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;});
phone.addEventListener('pointerup',e=>{
  const dx=e.clientX-sx, dy=e.clientY-sy;
  if (sy<80 && dy>70) { sx>phone.clientWidth/2 ? renderControl() : renderNotifications(); return; }
  if (dy<-90) { renderHome(); return; }
  if (sx<35 && dx>90) { renderHome(); }
});

document.addEventListener('keydown',e=>{
  if(e.key==='/' && state.screen!=='search'){ e.preventDefault(); renderSearch(); }
  if(e.key==='Escape') renderHome();
  if(e.key==='c') incomingCall();
});

renderLock();
tickStatus();
setInterval(tickStatus,30000);
window.GUANTA={renderHome,renderLock,renderControl,renderNotifications,renderSearch,incomingCall,state};
</script>
</body>
</html>
