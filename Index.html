<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MOBIO • GUANTA OS v0.5</title>
<style>
:root{--bg:#03070a;--panel:#081019;--line:#314450;--muted:#9dacb7;--cyan:#12d9e7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif;min-height:100%}
body{display:flex;justify-content:center;align-items:flex-start;padding:0}
.phone{position:relative;width:100vw;max-width:430px;min-height:100vh;background:
radial-gradient(circle at 88% 5%,rgba(0,220,230,.20),transparent 28%),
linear-gradient(180deg,#07131b 0%,#02070b 42%,#000 100%);overflow:hidden}
.status{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:12px;font-weight:800}
.page{padding:16px 18px 112px;min-height:calc(100vh - 46px)}
h1{font-size:28px;letter-spacing:.04em;margin:14px 0 6px} .sub{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 12px;margin-top:28px}
.app{border:0;background:transparent;color:#fff;padding:0;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:800;font-size:10px}
.icon{width:64px;height:64px;border-radius:16px;overflow:hidden;display:block;box-shadow:0 6px 14px rgba(0,0,0,.28)}
.icon img{width:100%;height:100%;display:block;object-fit:cover}
.card{margin-top:48px;border:1px solid var(--line);background:rgba(5,10,15,.82);border-radius:24px;padding:20px}
.card h2{margin:0 0 10px;font-size:24px} .card p{color:var(--muted);margin:8px 0;font-size:14px}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:10px;width:calc(min(430px,100vw) - 28px);height:78px;border:1px solid var(--line);border-radius:26px;background:rgba(4,8,12,.94);backdrop-filter:blur(18px);display:grid;grid-template-columns:repeat(4,1fr);padding:7px 8px;z-index:20}
.dock button{border:0;background:transparent;color:#fff;font-size:9px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.dock .icon{width:48px;height:48px;border-radius:13px;box-shadow:none}
.appview{padding-top:10px} .apphead{display:flex;align-items:center;gap:14px;margin-bottom:18px} .apphead .icon{width:70px;height:70px;border-radius:18px}
.panel{border:1px solid var(--line);border-radius:22px;background:rgba(5,10,15,.88);padding:18px;margin-top:12px}
.btn{width:100%;padding:13px;border-radius:14px;border:1px solid #425765;background:#101820;color:#fff;font-weight:800;margin-top:12px}
.search{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:#0a1218;color:#fff;font-size:15px;margin-top:18px}
.result{width:100%;display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:#091017;color:#fff;border-radius:15px;padding:10px;margin-top:8px}
.result .icon{width:40px;height:40px;border-radius:10px}
.overlay{display:none;position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.72);backdrop-filter:blur(15px);align-items:center;justify-content:center;padding:24px}
.overlay.show{display:flex} .call{width:min(360px,100%);background:#081018;border:1px solid var(--line);border-radius:26px;padding:24px;text-align:center}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px} .actions button{padding:14px;border-radius:14px;border:1px solid #40515c;background:#111820;color:#fff;font-weight:800}
</style>
</head>

</div>

const page=document.getElementById('page'), dock=document.getElementById('dock'), overlay=document.getElementById('overlay');

function now(){document.getElementById('time').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}
function icon(n){return `<span class="icon"><img src="${ICONS[n]}" alt="${n}"></span>`}
function renderDock(){
  dock.innerHTML=dockApps.map(n=>`<button data-d="${n}">${icon(n)}<span>${n}</span></button>`).join('');
  dock.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>openApp(b.dataset.d));
}
function home(){
  page.innerHTML=`<h1>GUANTA OS</h1><div class="sub">VYRSIA • Satellite link active</div>
  <div class="grid">${apps.map(n=>`<button class="app" data-a="${n}">${icon(n)}<span>${n}</span></button>`).join('')}</div>
  <div class="card"><h2>VYRSIA</h2><p>Connected World</p><p>Avatar Location • Central</p><strong>Satellite link active</strong></div>`;
  page.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>openApp(b.dataset.a));
  renderDock();
}
function openApp(n){
  let body='';
  if(n==='SENDIE') body='<b>Wallet</b><p>Balance and transfer interface using VYRSYON (VSN).</p><button class="btn">TOP UP</button>';
  else if(n==='MAGELLAN') body='<b>Travel</b><p>Flights • Hotels • Discovery</p><button class="btn">Search flights ✈</button>';
  else if(n==='WEATHER') body='<b>Weather</b><p>VYRSIA local forecast based on avatar location.</p>';
  else if(n==='ALBUM') body='<b>ALBUM</b><p>Photos and media library.</p>';
  else if(n==='CAMERA') body='<b>CAMERA</b><p>Camera interface module.</p>';
  else if(n==='SETTINGS') body='<b>SETTINGS</b><p>Satellite • Sound & Haptics • Privacy • Accessibility • Power</p>';
  else if(n==='BATTUTA') body='<b>BATTUTA</b><p>Maps and navigation.</p>';
  else if(n==='MOONDO') body='<b>MOONDO</b><p>Private GUANTA OS browser.</p><input class="search" placeholder="Search the web">';
  else if(n==='CALLS') body='<b>Calls</b><p>Recent calls and satellite voice.</p><button class="btn" id="incoming">Demo Incoming Call</button>';
  else if(n==='MESSAGES') body='<b>Messages</b><p>Conversations and satellite messaging.</p>';
  else if(n==='CONTACTS') body='<b>Contacts</b><p>People and address book.</p>';
  page.innerHTML=`<div class="appview"><div class="apphead">${icon(n)}<div><h1 style="margin:0">${n}</h1><div class="sub">GUANTA OS</div></div></div><div class="panel">${body}<button class="btn" id="home">Home</button></div></div>`;
  renderDock();
  document.getElementById('home').onclick=home;
  const incoming=document.getElementById('incoming'); if(incoming) incoming.onclick=incomingCall;
}
function incomingCall(){
  overlay.innerHTML=`<div class="call"><div class="sub">Incoming physical-phone call</div><h2>Incoming Call</h2><div class="sub">VYRSIA remains active</div><div class="actions"><button id="decline">Decline</button><button id="accept">Accept</button></div></div>`;
  overlay.classList.add('show');
  document.getElementById('decline').onclick=()=>overlay.classList.remove('show');
  document.getElementById('accept').onclick=()=>overlay.classList.remove('show');
}
let sx=0,sy=0; document.getElementById('phone').addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});
document.getElementById('phone').addEventListener('pointerup',e=>{if(e.clientY-sy<-100) home();});
now();setInterval(now,30000);home();
</script>
</body>
</html>
