<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a1118">
<title>VYRSIA • Baghdad</title>
<style>
:root{--ink:#081017;--panel:rgba(7,14,20,.78);--line:rgba(255,255,255,.13);--gold:#e7b75a;--blue:#79c9e8;--text:#f7f4ef;--muted:#b5c0c8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071018;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif;touch-action:none}canvas{display:block}
#game{position:fixed;inset:0;background:linear-gradient(#101a25,#070d12)}#scene{position:absolute;inset:0}
#boot{position:absolute;z-index:1000;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(circle at 50% 35%,#29384a 0,#0a1118 55%,#040709 100%);transition:opacity .55s}.logo{font-size:clamp(34px,8vw,78px);letter-spacing:.28em;margin-left:.28em;font-weight:800}.bootSub{margin-top:10px;letter-spacing:.18em;font-size:11px;color:#d2d6d8}.bar{width:min(310px,70vw);height:3px;background:rgba(255,255,255,.12);margin-top:28px;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;width:8%;background:linear-gradient(90deg,#c58e38,#f9df9e);transition:width .3s}.bootMsg{font-size:11px;color:#9faab2;margin-top:14px;min-height:14px}
#hud{position:absolute;z-index:30;inset:0;pointer-events:none}.panel{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(18px);box-shadow:0 12px 38px rgba(0,0,0,.22)}
#place{position:absolute;left:calc(14px + env(safe-area-inset-left));top:calc(14px + env(safe-area-inset-top));border-radius:18px;padding:12px 14px;min-width:190px}.vy{letter-spacing:.24em;font-weight:850;font-size:17px}.district{font-size:13px;margin-top:6px}.subline{font-size:10px;color:var(--muted);margin-top:3px}
#clock{position:absolute;right:calc(14px + env(safe-area-inset-right));top:calc(14px + env(safe-area-inset-top));border-radius:18px;padding:10px 13px;text-align:right}.time{font-size:21px;font-weight:800}.weather{font-size:10px;color:var(--muted);margin-top:3px}
#objective{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));border-radius:16px;padding:9px 13px;font-size:11px;max-width:70vw;text-align:center}.objectiveTitle{color:#f0c56f;font-weight:800}.objectiveDist{color:var(--muted);margin-left:7px}
#minimapWrap{position:absolute;left:calc(14px + env(safe-area-inset-left));bottom:calc(22px + env(safe-area-inset-bottom));width:150px;height:150px;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:#0d1821;box-shadow:0 12px 36px rgba(0,0,0,.28)}#map{width:100%;height:100%}
#fps{position:absolute;right:12px;bottom:8px;color:rgba(255,255,255,.35);font-size:9px;display:none}
#controls{position:absolute;z-index:50;inset:0;pointer-events:none}#joy{display:none;position:absolute;left:calc(20px + env(safe-area-inset-left));bottom:calc(22px + env(safe-area-inset-bottom));width:132px;height:132px;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.15);border-radius:50%;pointer-events:auto}#stick{position:absolute;left:39px;top:39px;width:54px;height:54px;border-radius:50%;border:1px solid rgba(255,255,255,.32);background:rgba(255,255,255,.12);box-shadow:0 5px 16px rgba(0,0,0,.25)}
#buttons{display:none;position:absolute;right:calc(16px + env(safe-area-inset-right));bottom:calc(24px + env(safe-area-inset-bottom));grid-template-columns:68px 68px;gap:9px;pointer-events:auto}.btn{height:56px;border-radius:18px;border:1px solid rgba(255,255,255,.14);background:rgba(6,13,18,.8);color:#fff;font-weight:800;font-size:11px;backdrop-filter:blur(14px)}.btn.run{border-color:rgba(231,183,90,.5);color:#f4cd7c}.btn.wide{grid-column:span 2}.btn.active{background:rgba(132,91,25,.72)}
#hint{position:absolute;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));padding:8px 12px;border-radius:12px;font-size:11px;display:none;pointer-events:none}
#toast{position:absolute;z-index:80;left:50%;top:18%;transform:translateX(-50%);padding:9px 13px;border-radius:13px;font-size:11px;display:none;max-width:80vw;text-align:center}
#menu{position:absolute;z-index:200;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(16px);display:none;align-items:center;justify-content:center;padding:16px}.menuBox{width:min(440px,94vw);border-radius:22px;padding:18px;background:#0c151c;border:1px solid var(--line);box-shadow:0 35px 100px rgba(0,0,0,.55)}.menuHead{font-weight:850;font-size:21px;letter-spacing:.05em}.menuSub{font-size:11px;color:var(--muted);margin:5px 0 15px}.menuRow{display:flex;gap:8px;flex-wrap:wrap}.menuRow button{flex:1;min-width:100px;height:44px;border-radius:13px;border:1px solid var(--line);background:#121f29;color:#fff;font-weight:750}.menuRow button.sel{border-color:#d4aa57;background:#332816}.close{margin-top:12px;width:100%;height:45px;border-radius:13px;border:1px solid var(--line);background:#f0f0ed;color:#111;font-weight:850}
#modelStatus{position:absolute;z-index:32;right:calc(14px + env(safe-area-inset-right));top:calc(91px + env(safe-area-inset-top));font-size:9px;color:rgba(255,255,255,.55);padding:5px 8px;border-radius:99px;background:rgba(0,0,0,.35);pointer-events:none}
@media(max-width:800px){#joy,#buttons{display:grid}#minimapWrap{width:108px;height:108px;bottom:calc(166px + env(safe-area-inset-bottom));border-radius:18px}#objective{bottom:calc(145px + env(safe-area-inset-bottom));max-width:52vw}#place{min-width:155px;padding:10px 11px}.vy{font-size:14px}.district{font-size:11px}#clock{padding:8px 10px}.time{font-size:18px}#modelStatus{top:calc(80px + env(safe-area-inset-top))}}
</style>
</head>
<body>
<div id="game"><div id="scene"></div>
<div id="boot"><div class="logo">VYRSIA</div><div class="bootSub">BAGHDAD • OPEN WORLD PROTOTYPE</div><div class="bar"><i id="bootBar"></i></div><div class="bootMsg" id="bootMsg">Starting Baghdad…</div></div>
<div id="hud"><div id="place" class="panel"><div class="vy">VYRSIA</div><div class="district" id="district">Baghdad</div><div class="subline" id="subline">Tigris • Baghdad night</div></div><div id="clock" class="panel"><div class="time" id="time">20:15</div><div class="weather">CLEAR • 27°C</div></div><div id="objective" class="panel"><span class="objectiveTitle" id="objectiveTitle">EXPLORE TAHRIR SQUARE</span><span class="objectiveDist" id="objectiveDist"></span></div><div id="minimapWrap"><canvas id="map" width="300" height="300"></canvas></div><div id="fps"></div><div id="modelStatus">Character: loading…</div></div>
<div id="controls"><div id="joy"><div id="stick"></div></div><div id="buttons"><button id="runBtn" class="btn run">SPRINT</button><button id="interactBtn" class="btn">INTERACT</button><button id="cameraBtn" class="btn wide">CAMERA</button><button id="menuBtn" class="btn wide">MENU</button></div></div>
<div id="hint" class="panel"></div><div id="toast" class="panel"></div>
<div id="menu"><div class="menuBox"><div class="menuHead">VYRSIA • Baghdad</div><div class="menuSub">Performance is tuned for iPhone. Higher quality adds resolution and shadows.</div><div class="menuRow"><button data-q="low">LOW</button><button data-q="medium" class="sel">MEDIUM</button><button data-q="high">HIGH</button></div><div class="menuRow" style="margin-top:8px"><button id="resetPos">RESET POSITION</button><button id="toggleFps">FPS</button></div><button id="closeMenu" class="close">RETURN TO BAGHDAD</button></div></div>
</div>
<script>
(()=>{'use strict';
const isMobile=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)||matchMedia('(pointer:coarse)').matches;
const $=id=>document.getElementById(id); const sceneHost=$('scene');
const bootBar=$('bootBar'),bootMsg=$('bootMsg'),boot=$('boot');
let toastTimer=0; function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').style.display='none',2600)}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Failed '+src));document.head.appendChild(s)})}
async function loadEngine(){const urls=['./three.min.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js','https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js','https://unpkg.com/three@0.160.0/build/three.min.js'];for(let i=0;i<urls.length;i++){try{bootMsg.textContent='Loading 3D engine…';bootBar.style.width=(10+i*8)+'%';await loadScript(urls[i]);if(window.THREE)return}catch(e){}}throw new Error('3D engine could not load')}
loadEngine().then(start).catch(e=>{bootMsg.textContent='Unable to start: '+e.message;bootBar.style.width='100%';bootBar.style.background='#c44'});

function start(){
const THREE=window.THREE; bootBar.style.width='35%';bootMsg.textContent='Building Baghdad…';
// Renderer
const renderer=new THREE.WebGLRenderer({antialias:!isMobile,powerPreference:'high-performance',alpha:false});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,isMobile?1.15:1.75));renderer.outputColorSpace=THREE.SRGBColorSpace||undefined;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.55;sceneHost.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x182430);scene.fog=new THREE.FogExp2(0x182430,0.00068);
const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.12,2200);camera.position.set(0,4,8);
const hemi=new THREE.HemisphereLight(0xb4d4ee,0x4f3d2b,2.05);scene.add(hemi);const moon=new THREE.DirectionalLight(0xc7dcff,1.15);moon.position.set(-200,380,160);scene.add(moon);
const warmSky=new THREE.DirectionalLight(0xffc27a,.82);warmSky.position.set(350,140,-500);scene.add(warmSky);
const clock=new THREE.Clock();

// World constants: 1 world unit = 1 metre
const WORLD=1800,RIVER_HALF=62,ROAD_Y=.025;const colliders=[],cameraOccluders=[],bridges=[],pois=[],districts=[];const roadSegments=[],streetLampPositions=[];
const matRoad=new THREE.MeshStandardMaterial({color:0x20262b,roughness:.9,metalness:.03});const matSidewalk=new THREE.MeshStandardMaterial({color:0x67645f,roughness:.95});const matRiver=new THREE.MeshStandardMaterial({color:0x123647,roughness:.3,metalness:.15,transparent:true,opacity:.93});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(WORLD,WORLD),new THREE.MeshStandardMaterial({color:0x4b463b,roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.04;scene.add(ground);
const river=new THREE.Mesh(new THREE.PlaneGeometry(RIVER_HALF*2,1800),matRiver);river.rotation.x=-Math.PI/2;river.position.set(0,.015,0);scene.add(river);
// subtle river glints
const riverGlow=new THREE.Mesh(new THREE.PlaneGeometry(112,1790),new THREE.MeshBasicMaterial({color:0x1f5266,transparent:true,opacity:.22}));riverGlow.rotation.x=-Math.PI/2;riverGlow.position.y=.025;scene.add(riverGlow);
function addRoad(x,z,w,l,rot=0){const g=new THREE.PlaneGeometry(w,l);const m=new THREE.Mesh(g,matRoad);m.rotation.x=-Math.PI/2;m.rotation.z=rot;m.position.set(x,ROAD_Y,z);scene.add(m);roadSegments.push({x,z,w,l,rot});return m}
function addSidewalk(x,z,w,l){const m=new THREE.Mesh(new THREE.BoxGeometry(w,.14,l),matSidewalk);m.position.set(x,.05,z);scene.add(m);return m}
// riverfront roads
addRoad(100,0,50,1650);addRoad(-100,0,50,1650);addSidewalk(72,0,8,1650);addSidewalk(-72,0,8,1650);
// major east/west avenues and north/south spines
[-650,-420,-210,40,280,520,760].forEach(z=>{addRoad(0,z,1650,34,Math.PI/2)});[-620,-430,-260,240,410,620].forEach(x=>{addRoad(x,0,32,1650)});
// additional city avenues
[-520,-320,-100,160,390,640].forEach(z=>{addRoad(360,z,620,18,Math.PI/2);addRoad(-360,z,620,18,Math.PI/2)});

function addBridge(name,z,w=24,style='flat'){const bridgeMat=new THREE.MeshStandardMaterial({color:0x73797e,roughness:.68,metalness:.18});const deck=new THREE.Mesh(new THREE.BoxGeometry(145,1.0,w),bridgeMat);deck.position.set(0,4.6,z);scene.add(deck);cameraOccluders.push(deck);const rampLen=42,rise=4.6,ang=Math.atan2(rise,rampLen);for(const side of [-1,1]){const ramp=new THREE.Mesh(new THREE.BoxGeometry(rampLen,1.0,w),bridgeMat);ramp.position.set(side*(72.5+rampLen/2),2.3,z);ramp.rotation.z=side*-ang;scene.add(ramp);cameraOccluders.push(ramp)}bridges.push({name,z,halfW:w/2,y:5.15,deckHalf:72.5,rampEnd:114.5});
for(const x of [-50,0,50]){const p=new THREE.Mesh(new THREE.BoxGeometry(4,5,5),new THREE.MeshStandardMaterial({color:0x77736a,roughness:.9}));p.position.set(x,2.2,z);scene.add(p)}
if(style==='suspension'){for(const x of [-55,55]){const tower=new THREE.Mesh(new THREE.BoxGeometry(5,24,6),new THREE.MeshStandardMaterial({color:0x555b60,roughness:.72}));tower.position.set(x,15,z);scene.add(tower);for(const s of [-1,1]){const cable=new THREE.Mesh(new THREE.CylinderGeometry(.18,.18,63,8),new THREE.MeshStandardMaterial({color:0x262b2f,metalness:.7,roughness:.35}));cable.position.set(x/2,18,z+s*2.3);cable.rotation.z=Math.PI/2.6;scene.add(cable)}}}
return deck}
addBridge('Al-Jumhuriya Bridge',40,28);addBridge('Al-Sarafiya Bridge',-420,26);addBridge('14 July Bridge',520,26,'suspension');addBridge('Two-Level Bridge',760,32);

// seeded city
let seed=9247;function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
function facadeTexture(base='#454b4c',lit='#efc16e'){const c=document.createElement('canvas');c.width=128;c.height=128;const ctx=c.getContext('2d');ctx.fillStyle=base;ctx.fillRect(0,0,128,128);for(let y=8;y<122;y+=16)for(let x=8;x<122;x+=16){ctx.fillStyle=rnd()>.35?lit:'#172028';ctx.globalAlpha=rnd()>.75?.95:.58;ctx.fillRect(x,y,8,7)}ctx.globalAlpha=1;const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.colorSpace=THREE.SRGBColorSpace||undefined;return t}
const facades=[facadeTexture('#4d504d','#e9b96a'),facadeTexture('#41464a','#d8a75c'),facadeTexture('#5a5148','#e7c47e')];const buildMats=facades.map((t,i)=>new THREE.MeshStandardMaterial({color:0xffffff,map:t,emissive:0xd09842,emissiveMap:t,emissiveIntensity:.45,roughness:.82,metalness:.04}));
const boxGeo=new THREE.BoxGeometry(1,1,1);const inst=[];for(let k=0;k<3;k++){const im=new THREE.InstancedMesh(boxGeo,buildMats[k],90);im.instanceMatrix.setUsage(THREE.StaticDrawUsage);im.count=0;scene.add(im);inst.push(im)}
const dummy=new THREE.Object3D();function forbiddenBuilding(x,z,w,d){if(Math.abs(x)<145)return true;for(const r of roadSegments){if(Math.abs(r.rot)<.1){if(Math.abs(x-r.x)<r.w/2+w/2+5&&Math.abs(z-r.z)<r.l/2+d/2+5)return true}else{if(Math.abs(z-r.z)<r.w/2+d/2+5&&Math.abs(x-r.x)<r.l/2+w/2+5)return true}}return false}
function addBuilding(x,z,w,d,h,style=0){if(forbiddenBuilding(x,z,w,d))return false;const im=inst[style%3],idx=im.count;if(idx>=90)return false;dummy.position.set(x,h/2,z);dummy.scale.set(w,h,d);dummy.rotation.y=(rnd()-.5)*.08;dummy.updateMatrix();im.setMatrixAt(idx,dummy.matrix);im.count++;im.instanceMatrix.needsUpdate=true;const b={minX:x-w*.54,maxX:x+w*.54,minZ:z-d*.54,maxZ:z+d*.54,h};colliders.push(b);return true}
for(let i=0;i<235;i++){const east=rnd()>.5;let x=(east?1:-1)*(150+rnd()*680),z=-790+rnd()*1580;const w=18+rnd()*38,d=16+rnd()*34;let h=12+rnd()*38;if(Math.abs(x)>480)h*=.75;if(rnd()>.90)h=58+rnd()*50;addBuilding(x,z,w,d,h,i%3)}

// Street lights using instancing, with emissive bulbs and only a handful of real point lights near player
const poleGeo=new THREE.CylinderGeometry(.12,.17,7,6),poleMat=new THREE.MeshStandardMaterial({color:0x202326,roughness:.65,metalness:.55});const bulbGeo=new THREE.SphereGeometry(.24,8,6),bulbMat=new THREE.MeshBasicMaterial({color:0xffd48a});const poleInst=new THREE.InstancedMesh(poleGeo,poleMat,220),bulbInst=new THREE.InstancedMesh(bulbGeo,bulbMat,220);scene.add(poleInst,bulbInst);let lampCount=0;
function lamp(x,z){if(lampCount>=220)return;dummy.position.set(x,3.5,z);dummy.scale.set(1,1,1);dummy.rotation.set(0,0,0);dummy.updateMatrix();poleInst.setMatrixAt(lampCount,dummy.matrix);dummy.position.y=7.0;dummy.updateMatrix();bulbInst.setMatrixAt(lampCount,dummy.matrix);streetLampPositions.push({x,z});lampCount++}
for(let z=-760;z<=760;z+=42){lamp(74,z);lamp(-74,z)}for(const z of [-650,-420,-210,40,280,520,760])for(let x=-760;x<=760;x+=58){if(Math.abs(x)>78)lamp(x,z-12)}poleInst.count=bulbInst.count=lampCount;poleInst.instanceMatrix.needsUpdate=bulbInst.instanceMatrix.needsUpdate=true;
const activeLights=[];for(let i=0;i<(isMobile?4:8);i++){const l=new THREE.PointLight(0xffc976,isMobile?7:9,52,2);l.position.y=6.4;scene.add(l);activeLights.push(l)}

// Trees
const trunkGeo=new THREE.CylinderGeometry(.25,.35,5,7),trunkMat=new THREE.MeshStandardMaterial({color:0x5b3b27,roughness:1}),crownGeo=new THREE.SphereGeometry(2.2,7,5),crownMat=new THREE.MeshStandardMaterial({color:0x244b31,roughness:1});const trunks=new THREE.InstancedMesh(trunkGeo,trunkMat,120),crowns=new THREE.InstancedMesh(crownGeo,crownMat,120);scene.add(trunks,crowns);let tc=0;function tree(x,z){if(tc>=120)return;dummy.position.set(x,2.5,z);dummy.scale.set(1,1,1);dummy.updateMatrix();trunks.setMatrixAt(tc,dummy.matrix);dummy.position.y=6;dummy.scale.set(1,1.5,1);dummy.updateMatrix();crowns.setMatrixAt(tc,dummy.matrix);tc++}for(let z=-730;z<=730;z+=35){tree(66,z);tree(-66,z)}trunks.count=crowns.count=tc;trunks.instanceMatrix.needsUpdate=crowns.instanceMatrix.needsUpdate=true;

function labelSprite(text,color='#f5ead5',scale=1){const c=document.createElement('canvas');c.width=512;c.height=90;const ctx=c.getContext('2d');ctx.clearRect(0,0,512,90);ctx.font='700 30px Arial';ctx.textAlign='center';ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(45,20,422,50);ctx.fillStyle=color;ctx.fillText(text,256,55);const tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace||undefined;const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false}));sp.scale.set(24*scale,4.2*scale,1);return sp}
function registerPOI(name,x,z,obj,info=''){pois.push({name,x,z,obj,info});if(obj){const s=labelSprite(name);s.position.set(0,Math.max(8,obj.userData.height||12)+5,0);obj.add(s)}}
// Baghdad Tower
function baghdadTower(){const g=new THREE.Group();const shaft=new THREE.Mesh(new THREE.CylinderGeometry(5.4,7.2,118,20),new THREE.MeshStandardMaterial({color:0xc7c2b8,roughness:.66}));shaft.position.y=59;g.add(shaft);const disk=new THREE.Mesh(new THREE.CylinderGeometry(21,18,9,30),new THREE.MeshStandardMaterial({color:0x52656e,metalness:.32,roughness:.48}));disk.position.y=111;g.add(disk);const ring=new THREE.Mesh(new THREE.CylinderGeometry(22.5,22.5,2,30),new THREE.MeshBasicMaterial({color:0x9ed6e5}));ring.position.y=113;g.add(ring);const mast=new THREE.Mesh(new THREE.CylinderGeometry(.65,.8,47,8),new THREE.MeshStandardMaterial({color:0xbcc2c4,metalness:.4}));mast.position.y=139;g.add(mast);g.position.set(-420,0,-175);g.userData.height=162;scene.add(g);registerPOI('BAGHDAD TOWER',-420,-175,g,'Baghdad Tower');colliders.push({minX:-437,maxX:-403,minZ:-192,maxZ:-158,h:165});return g}baghdadTower();
// Freedom Monument
function freedom(){const g=new THREE.Group();const wall=new THREE.Mesh(new THREE.BoxGeometry(52,10,2.4),new THREE.MeshStandardMaterial({color:0xe4dfd2,roughness:.9}));wall.position.y=8;g.add(wall);for(let i=-6;i<=6;i++){const fig=new THREE.Mesh(new THREE.BoxGeometry(2.1,3.2+Math.abs(i%3),.75),new THREE.MeshStandardMaterial({color:0x6d4a2f,metalness:.6,roughness:.45}));fig.position.set(i*3.5,8,.0);g.add(fig)}g.position.set(190,0,40);g.userData.height=15;scene.add(g);registerPOI('TAHRIR / FREEDOM MONUMENT',190,40,g,'Nasb al-Hurriyah');colliders.push({minX:162,maxX:218,minZ:35,maxZ:45,h:16});return g}freedom();
// Al Shaheed split dome

function updatePlayer(dt){let ix=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+joyX,iz=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0)+joyY;const mag=Math.hypot(ix,iz);if(mag>1){ix/=mag;iz/=mag}const moving=mag>.08;const sprint=sprintTouch||keys.ShiftLeft||keys.ShiftRight;const targetSpeed=moving?(sprint?7.0:4.1):0;currentSpeed+= (targetSpeed-currentSpeed)*(1-Math.exp(-dt*(moving?7:9)));if(moving){const forwardX=-Math.sin(camYaw),forwardZ=-Math.cos(camYaw),rightX=Math.cos(camYaw),rightZ=-Math.sin(camYaw);let dx=(rightX*ix+forwardX*(-iz)),dz=(rightZ*ix+forwardZ*(-iz));const d=Math.hypot(dx,dz)||1;dx/=d;dz/=d;const targetAngle=Math.atan2(dx,dz);let delta=((targetAngle-playerRoot.rotation.y+Math.PI)%(Math.PI*2))-Math.PI;playerRoot.rotation.y+=delta*(1-Math.exp(-dt*11));moveWithCollision(dx*currentSpeed*dt,dz*currentSpeed*dt)}if(!moving||currentSpeed<.4)setAnim('idle');else if(currentSpeed<5.4)setAnim('walk');else setAnim('run');if(modelMixer)modelMixer.update(dt);for(const mx of npcMixers)mx.update(dt);const shadowY=groundY(playerRoot.position.x,playerRoot.position.z);playerRoot.position.y=shadowY}

function animate(){requestAnimationFrame(animate);const dt=Math.min(.04,clock.getDelta());updatePlayer(dt);updateCamera(dt);uiT+=dt;mapT+=dt;lightT+=dt;fpsT+=dt;frames++;if(uiT>.16){uiT=0;updateUI()}if(mapT>.12){mapT=0;drawMap()}if(lightT>.65){lightT=0;updateActiveLights()}if(showFps&&fpsT>1){$('fps').textContent=Math.round(frames/fpsT)+' FPS';frames=0;fpsT=0}renderer.render(scene,camera)}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
bootBar.style.width='100%';bootMsg.textContent='Baghdad ready';updateActiveLights();drawMap();updateUI();setTimeout(()=>{boot.style.opacity='0';setTimeout(()=>boot.style.display='none',600)},450);animate();
}
